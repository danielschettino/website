<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Countdown | Dan</title>

  <link rel="stylesheet" href="dia1.css">
</head>
<body>

  <h1>Countdown</h1>

  <div id="countdown">
    <div class="time">
      <span id="days">00</span>
      <small>DIAS</small>
    </div>

    <div class="time">
      <span id="hours">00</span>
      <small>HORAS</small>
    </div>

    <div class="time">
      <span id="minutes">00</span>
      <small>MINUTOS</small>
    </div>

    <div class="time">
      <span id="seconds">00</span>
      <small>SEGUNDOS</small>
    </div>
  </div>

  
  <script src="script.js"></script>
</body>
</html>
