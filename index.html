  <script>
    const text = "Dev Dan";
    const speed = 90;

    let index = 0;
    const typeEl = document.getElementById("type");

    function typeEffect() {
      if (index < text.length) {
        typeEl.textContent += text.charAt(index);
        index++;
        setTimeout(typeEffect, speed);
      }
    }

    typeEffect();
  </script>
