<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dan</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0d0d0d;
      color: #eaeaea;
      font-family: "Courier New", monospace;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    p {
      margin-top: 12px;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* Link */
    #delayed-link {
      margin-top: 25px;
      text-decoration: none;
      color: #00ffcc;
      font-size: 0.95rem;
      border: 1px solid #00ffcc;
      padding: 8px 18px;
      border-radius: 4px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #delayed-link:hover {
      background-color: #00ffcc;
      color: #0d0d0d;
    }
  </style>
</head>
<body>

  <h1>
    <span id="type"></span><span class="cursor">|</span>
  </h1>

  <p>Site em construção...</p>

  <a id="delayed-link" href="https://drive.google.com/drive/folders/1J14YfF2xKt12EvX3a6oq1hXJ2dgaKnSv" target="_blank">
    Google Drive
  </a>

  <script>
    const text = "Dev Dan";
    const speed = 90;

    let index = 0;
    const typeEl = document.getElementById("type");

    function typeEffect() {
      if (index < text.length) {
        typeEl.textContent += text.charAt(index);
        index++;
        setTimeout(typeEffect, speed);
      }
    }

    typeEffect();
  </script>

</body>
</html>
